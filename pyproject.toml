[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus"
dynamic = ["version"]
description = "A GUI workflow for animal tracking and movement analysis."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "customtkinter==5.2.2",
    "filterpy==1.4.5",
    "h5py==3.16.0",
    "imageio-ffmpeg==0.6.0; sys_platform == 'darwin'",
    "matplotlib==3.10.6",
    "motmetrics==1.4.0",
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "pandas==2.3.3",
    "Pillow==11.3.0",
    "psutil==7.1.0",
    "PyYAML==6.0.2",
    "scikit-learn==1.7.2",
    "scipy==1.11.4",
    "tables==3.10.1",
    "tkinterdnd2==0.6.3",
    "tqdm==4.67.1",
    "ultralytics==8.3.185",
]

[project.optional-dependencies]
cpu = [
    "torch==2.7.1",
    "torchvision==0.22.1",
]
macos = [
    "torch==2.7.1",
    "torchvision==0.22.1",
]
cu128 = [
    "torch==2.7.1",
    "torchvision==0.22.1",
]

rocm63 = [
    "pytorch-triton-rocm==3.3.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch==2.7.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision==0.22.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
amadeus = "gui.gui_home:main"

[tool.setuptools]
packages = [
    "assets",
    "gui",
    "main",
    "main.without_direction_estimation",
    "tools",
]

[tool.setuptools.package-data]
assets = ["*.json", "*.jpg", "*.png"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.uv]
required-version = "==0.12.17"
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
        { extra = "rocm63" },
        { extra = "macos" },
    ],
]

[tool.uv.sources]
pytorch-triton-rocm = { index = "pytorch-shared", extra = "rocm63" }
torch = [
    { index = "pytorch-rocm63", extra = "rocm63", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-rocm63", extra = "rocm63", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm63"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true

[[tool.uv.index]]
name = "pytorch-shared"
url = "https://download.pytorch.org/whl"
explicit = true
