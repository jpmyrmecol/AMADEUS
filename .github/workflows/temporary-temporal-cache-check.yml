name: Temporary temporal persistence verification
on:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q gui main tests
      - name: Install minimal test dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.11.4 opencv-python-headless==4.10.0.84
      - name: Run temporal tests
        run: python -m unittest discover -s tests -p "test_temporal*.py" -v
