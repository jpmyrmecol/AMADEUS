name: Advanced Tracking range controls

on:
  pull_request:
    paths:
      - "gui/gui_advanced_tracking.py"
      - "tests/test_advanced_analysis_range.py"
      - ".github/workflows/advanced-analysis-range-tests.yml"
  push:
    branches: [main]
    paths:
      - "gui/gui_advanced_tracking.py"
      - "tests/test_advanced_analysis_range.py"
      - ".github/workflows/advanced-analysis-range-tests.yml"

jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Advanced Tracking
        run: python -m py_compile gui/gui_advanced_tracking.py
      - name: Verify Analysis Range enablement
        run: python -m unittest discover -s tests -p "test_advanced_analysis_range.py" -v
