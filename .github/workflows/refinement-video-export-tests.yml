name: Refinement video overlay tests

on:
  pull_request:
    paths:
      - "gui/gui_refinement.py"
      - "gui/refinement_video_export.py"
      - "tests/test_refinement_video_export.py"
      - ".github/workflows/refinement-video-export-tests.yml"
  push:
    branches: [main]
    paths:
      - "gui/gui_refinement.py"
      - "gui/refinement_video_export.py"
      - "tests/test_refinement_video_export.py"
      - ".github/workflows/refinement-video-export-tests.yml"

jobs:
  overlay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install export test dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.3.3 opencv-python-headless==4.10.0.84
      - name: Run Refinement export tests
        run: python -m unittest discover -s tests -p "test_refinement_video_export.py" -v
