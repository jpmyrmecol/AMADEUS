name: Video compatibility regression tests

on:
  pull_request:
    paths:
      - "main/video_compat.py"
      - "gui/gui_segmentation.py"
      - "gui/video_input.py"
      - "tests/**"
      - ".github/workflows/video-compat-tests.yml"
  push:
    branches: [main]
    paths:
      - "main/video_compat.py"
      - "gui/gui_segmentation.py"
      - "gui/video_input.py"
      - "tests/**"
      - ".github/workflows/video-compat-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run video regression tests
        run: python -m unittest discover -s tests -p "test_video_compat.py" -v
